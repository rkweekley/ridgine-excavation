name: Build & Deploy Ridgeline Excavation

# Push to main -> build a multi-arch image (arm64 for the Mac Mini) -> GHCR -> pull + recreate on the Mac.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/ridgine-excavation

jobs:
  build:
    name: Build & push image to GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (arm64 emulation for the Mac Mini)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Multi-arch is required: the Mac Mini is Apple Silicon (arm64).
      - name: Build and push (linux/amd64 + linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Mac Mini
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Pull the new image and recreate the container
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.MAC_MINI_HOST }}
          username: ${{ secrets.DEPLOY_USER_PROD }}
          key: ${{ secrets.DEPLOY_SSH_KEY_PROD }}
          script_stop: true
          script: |
            # macOS non-interactive SSH does not inherit the interactive PATH
            export PATH="/usr/local/bin:$PATH"
            IMAGE="ghcr.io/${{ github.repository_owner }}/ridgine-excavation:latest"
            APP_DIR="/Users/cyberal/docker/ridgine-excavation"

            echo "[1/3] pulling $IMAGE"
            docker pull "$IMAGE"

            echo "[2/3] recreating container"
            docker rm -f ridgine-excavation >/dev/null 2>&1 || true
            docker run -d --name ridgine-excavation \
              --network mac \
              -p 127.0.0.1:5000:5000 \
              --restart unless-stopped \
              --env-file "$APP_DIR/ridgine.env" \
              "$IMAGE"

            echo "[3/3] health check through Nginx Proxy Manager"
            sleep 5
            code=$(docker exec nginx-proxy-manager sh -c "curl -s -o /dev/null -w '%{http_code}' http://ridgine-excavation:5000/" || true)
            echo "NPM -> ridgine-excavation:5000 = $code"
            # fail the job loudly instead of printing a green line over a dead site
            test "$code" = "200"
